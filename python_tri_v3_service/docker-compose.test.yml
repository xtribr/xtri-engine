services:
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: xtri-tests
    volumes:
      # Mount source + tests for fast iteration (no rebuild needed)
      - ./app:/app/app:ro
      - ./tests:/app/tests:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
    environment:
      - PYTHONUNBUFFERED=1
    # Override CMD per use-case:
    #   docker compose -f docker-compose.test.yml run test pytest tests/test_cientifico.py -v
    #   docker compose -f docker-compose.test.yml run test pytest -k "test_eap" -v
    #   docker compose -f docker-compose.test.yml run test pytest --cov=app --cov-report=html

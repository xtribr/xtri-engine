[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xtri-service"
version = "2.1.0"
description = "XTRI Engine API — IRT scoring for ENEM simulations"
requires-python = ">=3.11"
authors = [{name = "Alexandre Emerson"}]
license = {text = "Proprietary"}
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.0",
    "supabase>=2.4.0",
    "python-dotenv>=1.0.0",
    # Phase 7 P2: Parquet cache for microdata analysis. pandas uses pyarrow
    # automatically for read_parquet/to_parquet. Adds ~50 MB to bundle.
    "pyarrow>=14.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
app = [
    "referencias/*.json",
    "static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (fast, no I/O)",
    "integration: Integration tests (full pipeline)",
    "api: API endpoint tests (FastAPI TestClient)",
]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = [
    "tests/*",
    "app/scripts/*",       # CLI tools tested via integration runs
    "app/db/*",            # External service clients
]

[tool.coverage.report]
show_missing = true
fail_under = 80
